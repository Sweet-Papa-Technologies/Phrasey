# Build the Phrasey game server image and roll it onto Cloud Run.
#
#   gcloud builds submit . --config cloudbuild.yaml \
#     --project fofoapps-934be --region us-central1 \
#     --substitutions=_TAG=$(git rev-parse --short HEAD)
#
# scripts/deploy.sh wraps this and is the supported entry point. A Cloud Build
# trigger, if one is ever added, should pass _TAG=$SHORT_SHA.
#
# Terraform owns the service's shape (scaling, CPU, env, probes) and ignores
# image drift, so the `gcloud run deploy --image` step below is not fighting it.

substitutions:
  _REGION: us-central1
  _REPO: phrasey
  _SERVICE: phrasey-server
  # Short commit SHA, supplied by the caller. "manual" only when nobody did.
  _TAG: manual

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  env:
    - DOCKER_BUILDKIT=1

# Both tags are pushed by the steps below; listing them here also records them
# on the build record.
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest

steps:
  # Built from the repo root — the Dockerfile needs the whole pnpm workspace.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=packages/server/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - id: push-tag
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}']

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest']

  # Deploy the specific tag rather than :latest, so rolling back is a one-liner
  # against a known commit.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --project=${PROJECT_ID}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}
      - --quiet

timeout: 1200s

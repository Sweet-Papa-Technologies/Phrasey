<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phrasey — coming soon</title>
<meta name="description" content="A word-guessing party game where you can only guess letters you're holding.">
<meta name="robots" content="noindex">
<style>
  :root {
    --ink: #14121F;
    --chill: #EAF4F7;
    --fanta: #FF5C1A;
    --cherry: #FF2E63;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--ink);
    color: var(--chill);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.25rem, 9vw, 5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  h1 .dash { color: var(--fanta); }
  p {
    margin: 1.25rem 0 0;
    font-size: clamp(0.95rem, 2.5vw, 1.125rem);
    opacity: 0.62;
    max-width: 34ch;
  }
  .rule {
    width: 3.5rem;
    height: 3px;
    margin: 2rem auto 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--cherry), var(--fanta));
  }
</style>
</head>
<body>
  <main>
    <h1>Phrasey <span class="dash">—</span> coming soon</h1>
    <p>A word-guessing party game where you can only guess letters you&rsquo;re holding.</p>
    <div class="rule"></div>
  </main>
</body>
</html>
